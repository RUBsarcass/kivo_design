<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kivo – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffbff;--surface:#fff;--on:#201a19;--muted:#6f625f;--p:#e8431f;--on-p:#fff;--pc:#ffdad2;--on-pc:#410001;--t:#006a6a;--tc:#9cf1f0;--on-tc:#002020;--outline:#d8c2bd;--shadow:0 10px 30px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181210;--surface:#251e1c;--on:#f1dfda;--muted:#a08c87;--p:#ffb4a2;--on-p:#601200;--pc:#8a2200;--on-pc:#ffdad2;--t:#4cd9d9;--tc:#004f4f;--on-tc:#9cf1f0;--outline:#53433f;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#181210;--surface:#251e1c;--on:#f1dfda;--muted:#a08c87;--p:#ffb4a2;--on-p:#601200;--pc:#8a2200;--on-pc:#ffdad2;--t:#4cd9d9;--tc:#004f4f;--on-tc:#9cf1f0;--outline:#53433f;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--on);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
@media(min-width:520px){body{background:#e9e1df}.phone{width:390px;height:800px;max-height:96%;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.3);border:8px solid #111}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 22px 22px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;animation:float 9s ease-in-out infinite}
.b1{width:240px;height:240px;background:var(--p);top:-60px;right:-80px}
.b2{width:220px;height:220px;background:var(--t);bottom:120px;left:-90px;animation-delay:-4s}
@keyframes float{50%{transform:translate(20px,30px) scale(1.1)}}
.logo{display:flex;align-items:center;gap:10px;margin-top:18px;z-index:1}
.logo i{width:44px;height:44px;border-radius:14px;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:24px;transform:rotate(-8deg)}
.logo b{font-size:26px;letter-spacing:-.5px;font-weight:800}
h1{font-size:34px;line-height:1.1;letter-spacing:-1px;font-weight:800;margin:34px 0 10px;z-index:1}
h1 span{color:var(--p)}
.sub{color:var(--muted);font-size:15px;line-height:1.5;z-index:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;z-index:1}
.chips span{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--outline)}
.spacer{flex:1}
.label{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;z-index:1;text-align:center}
.card{position:relative;z-index:1;width:100%;border:0;text-align:left;font:inherit;cursor:pointer;border-radius:28px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.97)}
.card:hover{transform:translateY(-2px)}
.card.m{background:var(--p);color:var(--on-p)}
.card.c{background:var(--tc);color:var(--on-tc)}
.ico{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:30px;flex:none}
.card h2{font-size:19px;font-weight:800;margin-bottom:3px}
.card p{font-size:13px;opacity:.9;line-height:1.35}
.arr{margin-left:auto;font-size:22px;font-weight:800}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;z-index:1}
.theme{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5;border:1px solid var(--outline);background:var(--surface);color:var(--on);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px}
/* placeholder */
.top{display:flex;align-items:center;gap:12px;margin-top:14px}
.back{border:0;background:var(--surface);color:var(--on);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.hero{margin:40px 0 20px;padding:28px;border-radius:32px;text-align:center}
.hero .big{font-size:56px}
.hero h2{font-size:24px;margin:10px 0 6px;font-weight:800}
.hero p{font-size:14px;line-height:1.5;opacity:.85}
.tabs{display:flex;justify-content:space-around;padding:12px 6px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);margin-top:auto}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.tabs div b{font-size:20px;padding:2px 18px;border-radius:99px;font-weight:400}
.tabs .on{color:var(--on)}.tabs .on b{background:var(--pc)}
.badge{align-self:center;font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--pc);color:var(--on-pc)}
button{font-family:inherit}
:is(#member,#courier){padding:0;background:var(--bg);color:var(--on)}
:is(#member,#courier) svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;align-items:center;gap:6px;padding:12px 10px 4px}
.ib{width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--on);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib i{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#e5251b}
.search{flex:1;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:99px;padding:9px 14px;color:var(--muted);font-size:14px}
.search svg{width:18px;height:18px}
.chs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;flex:none}
.chp{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--outline);color:var(--on);cursor:pointer}
.chp.on{background:var(--on);color:var(--bg);border-color:var(--on)}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 16px;scrollbar-width:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.sec a{font-size:13px;font-weight:600;color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}.row .lc{width:138px;flex:none}
.th{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.th>svg{width:60px;height:60px;stroke-width:1.4}
.lc{cursor:pointer}.lc .m{display:flex;gap:8px;margin-top:8px}
.lc b{font-size:13px;line-height:1.25;display:block;font-weight:600}.lc small{color:var(--muted);font-size:12px}
.mav{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.live{position:absolute;top:8px;left:8px;background:#e5251b;color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.5px}
:is(#member,#courier) .vw{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;display:flex;gap:4px;align-items:center}
:is(#member,#courier) .vw svg{width:11px;height:11px}
.tag{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.93);color:#111;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.hr{aspect-ratio:16/10;padding-bottom:50px}
.ov{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:3px;text-align:left;color:#fff}
.ov b{font-size:17px;font-weight:800}.ov small{opacity:.9;font-size:12px}
.ov button{align-self:flex-start;margin-top:6px;border:0;background:#fff;color:#111;font-size:12px;font-weight:700;padding:8px 16px;border-radius:99px;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-around;background:var(--surface);padding:8px 4px 6px;border-top:1px solid var(--outline);flex:none}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;cursor:pointer;min-width:56px}
.nav button.on{color:var(--on)}.nav button.on svg{fill:currentColor}
.plus{width:46px;height:32px;border-radius:10px;background:var(--p);position:relative;display:grid;place-items:center;color:var(--on-p);box-shadow:-3px 0 0 var(--t),3px 0 0 var(--pc)}
:is(#member,#courier) .plus svg{stroke-width:3}
.pane{position:absolute;left:0;right:0;top:0;bottom:58px;background:var(--bg);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px}
.pane.show{display:flex}.pane h2{font-size:22px}.pane p{color:var(--muted);font-size:13px}
.pane button{border:1px solid var(--outline);background:var(--surface);color:var(--on);padding:10px 18px;border-radius:99px;font-weight:600;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 18px 24px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}.sheet h3{text-align:center;margin:6px 0 14px;font-size:16px}
.sheet button{width:100%;border:0;background:var(--bg);color:var(--on);font-size:15px;font-weight:600;text-align:left;padding:14px;border-radius:18px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.scrim{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.5);display:none}.scrim.show{display:block}
.toast{position:absolute;left:50%;top:70px;z-index:30;transform:translate(-50%,-20px);background:var(--on);color:var(--bg);font-weight:700;font-size:13px;padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}

.disc{position:absolute;left:0;right:0;top:0;bottom:58px;background:var(--bg);z-index:7;display:none;flex-direction:column}.disc.show{display:flex}
.vf{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.it{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center}
.it:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.5),transparent 22%,transparent 45%,rgba(0,0,0,.8))}
:is(#member,#courier) .bgi svg{width:150px;height:150px;stroke-width:1;opacity:.3}.bgi{margin-bottom:150px}
.tp{position:absolute;top:0;left:0;right:58px;padding:14px 12px;display:flex;align-items:flex-start;gap:8px;z-index:2}
.sw{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.sl{display:flex;align-items:center;gap:8px;min-width:0;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.sl b{font-size:13px;display:block}.sl small{font-size:11px;opacity:.85}
.fl{border:0;background:var(--p);color:var(--on-p);font-size:10.5px;font-weight:600;line-height:1;padding:5px 11px;border-radius:99px;cursor:pointer}
.vw2{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.lv{display:grid;margin-right:2px}
:is(#member,#courier) .lv svg{width:15px;height:15px}
:is(#member,#courier) .vw2 svg{width:13px;height:13px}
.xp{position:absolute;top:12px;right:10px;z-index:6;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.xp small{font-size:10px;font-weight:600}:is(#member,#courier) .xp svg{width:24px;height:24px}
.ft{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.mid{display:flex;align-items:flex-end;gap:10px}
.lft{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.chat{display:flex;flex-direction:column;gap:7px}
.chat p{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.3}
.ca{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;background:rgba(255,255,255,.3)}
.chat b{font-weight:700;margin-right:4px}
.say{align-self:flex-start;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;font-size:12px}
.rl{display:flex;flex-direction:column;gap:12px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.rb button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
.rb em{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#fe2c55;font-size:9px;font-style:normal;font-weight:700;display:grid;place-items:center}
.rb .liked svg{fill:#ff2d55;stroke:#ff2d55}:is(#member,#courier) .rb svg{width:20px;height:20px}
.pt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pl{min-width:0}.pl b{font-size:14px;font-weight:700;line-height:1.2;display:block}
.more{font-size:12px;opacity:.85;display:flex;align-items:center;gap:2px;margin-top:4px}:is(#member,#courier) .more svg{width:14px;height:14px}
.pp{text-align:right;flex:none}.pp strong{font-size:14px;font-weight:700;display:block}
.pp small{font-size:12px;opacity:.9;display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:4px}:is(#member,#courier) .pp small svg{width:14px;height:14px}
.bb{display:flex;justify-content:center}
.bb button{border-radius:99px;height:44px;font-size:14px;font-weight:700;cursor:pointer;text-shadow:none;border:0}
.bb .gh{flex:1;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(8px)}
.bb .pb1{width:82%;background:var(--p);color:var(--on-p)}
.live{display:flex;align-items:center;gap:3px}:is(#member,#courier) .live svg{width:12px;height:12px}
.cap{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lst{display:flex;flex-direction:column;gap:12px;max-height:300px;overflow:auto;margin-bottom:12px}
.rw{display:flex;gap:10px;align-items:center}.rw b{font-size:14px;display:block}.rw small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.sheet .rw button{width:auto;margin:0;padding:8px 14px;border-radius:99px;background:var(--p);color:var(--on-p);font-size:12px}
.sh{display:flex;align-items:center;gap:12px;padding:6px 0 10px}.sh small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fl2{border:0;background:var(--p);color:var(--on-p);font-size:12px;font-weight:700;padding:8px 16px;border-radius:99px;cursor:pointer}
.ban{display:flex;gap:12px;align-items:center;background:var(--pc);color:var(--on-pc);border-radius:16px;padding:12px 14px;margin:6px 0}.ban small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.dsc{font-size:12.5px;line-height:1.45;max-height:0;overflow:hidden;opacity:0;margin:0;transition:max-height .35s,opacity .3s,margin .3s}
.pl.open .dsc{max-height:170px;opacity:1;margin:6px 0 0}
.more i{font-style:normal}.more svg{transition:transform .3s}.pl.open .more svg{transform:rotate(180deg)}.more{cursor:pointer}
.sc{width:92px;flex:none;text-align:center;cursor:pointer}
.sc .mav{width:56px;height:56px;font-size:20px;margin:0 auto 6px}
.sc b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc small{color:var(--muted);font-size:11px}
.oc{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:14px;margin-bottom:12px}
.oh{display:flex;align-items:center;gap:10px}.oh>div:not(.mav){flex:1;min-width:0}.oh b{font-size:14px;display:block}.oh small{color:var(--muted);font-size:12px}
.bdg{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--pc);color:var(--on-pc);white-space:nowrap}
.bdg.ok{background:var(--tc);color:var(--on-tc)}.bdg.no{background:var(--outline);color:var(--muted)}
.oi{display:flex;gap:10px;align-items:center;margin:12px 0}.oi .pi{width:44px;height:44px}.oi b{font-size:13px;display:block;font-weight:600}.oi small{color:var(--muted);font-size:12px}.oi strong{margin-left:auto;font-size:14px;white-space:nowrap}
.stp{display:flex;margin:6px 0 10px}
.stp div{flex:1;text-align:center;font-size:10px;color:var(--muted);position:relative;padding-top:16px}
.stp div:before{content:'';position:absolute;top:2px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--outline);z-index:1}
.stp div:after{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--outline)}
.stp div:first-child:after{display:none}
.stp .d{color:var(--on);font-weight:600}.stp .d:before,.stp .d:after{background:var(--p)}
.eta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:12px}.eta svg{color:var(--p)}
.ob{display:flex;gap:8px}.ob button{border:0;border-radius:99px;height:40px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ob .p{flex:1;background:var(--p);color:var(--on-p)}.ob .g{flex:1;background:var(--bg);color:var(--on);border:1px solid var(--outline)}
.ob .ic{width:40px;flex:none;background:var(--bg);color:var(--on);border:1px solid var(--outline);display:grid;place-items:center}
:is(#member,#courier) .ob svg{width:18px;height:18px}
:is(#member,#courier) .map{width:100%;height:auto;display:block;background:var(--surface);border-radius:20px;border:1px solid var(--outline)}
.tc{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:14px;margin-top:12px}
.tb{font-size:26px;font-weight:800;letter-spacing:-.5px}
.code{display:flex;gap:8px;margin-top:8px}.code span{width:42px;height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--outline);display:grid;place-items:center;font-size:22px;font-weight:800}
.hr2{height:1px;background:var(--outline);margin:12px 0}
.oc{cursor:pointer}.tc>b{font-size:14px;display:block;margin-bottom:10px}
.tl{display:flex;flex-direction:column}
.tl div{display:flex;gap:12px;padding-bottom:14px;position:relative;font-size:13px;color:var(--muted);align-items:flex-start}
.tl div:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--outline);flex:none;margin-top:4px;z-index:1}
.tl div:after{content:'';position:absolute;left:4px;top:14px;bottom:-4px;width:2px;background:var(--outline)}
.tl div:last-child{padding-bottom:0}.tl div:last-child:after{display:none}
.tl .d{color:var(--on);font-weight:600}.tl .d:before,.tl .d:after{background:var(--p)}.tl .l:after{background:var(--outline)}
.tl span{flex:1}.tl small{color:var(--muted);font-size:12px;font-weight:400}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;color:var(--muted)}.kv>:last-child{color:var(--on);text-align:right}
.kv.t{font-weight:800;font-size:15px;border-top:1px solid var(--outline);margin-top:6px;padding-top:10px}.kv.t>*{color:var(--on)}
.tc .oi:first-of-type{margin-top:0}
.ab{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}

 $('cf').innerHTML=`<h3>Adresses de livraison</h3><div class="lst">${ADDR.map((x,i)=>`<div class="rw ad" data-i="${i}" style="cursor:pointer"><div class="pi" style="background:var(--pc);color:var(--on-pc)">${S('pin')}</div><div style="flex:1;min-width:0"><b>${x.n}</b><small>${x.a}</small></div>${i===ASEL?'<span class="bdg ok">Choisie</span>':''}</div>`).join('')}</div><button class="cp" id="an">Ajouter une adresse</button>`;
 $('cf').querySelectorAll('.ad').forEach(e=>e.onclick=()=>{ASEL=+e.dataset.i;off();cb&&cb()});$('an').onclick=()=>addrNew(cb);$('cf').classList.add('show');$('scrim').classList.add('show')}
function addrNew(cb){let k=0;const Q=['Plateau','Yantala','Lazaret','Terminus','Koira Kano'];
 $('cf').innerHTML=`<h3>Nouvelle adresse</h3><input class="inp" id="an1" maxlength="24" placeholder="Nom (Domicile, Bureau…)" style="margin:0 0 12px"><div class="po" id="aq">${Q.map((q,i)=>`<span class="${i?'':'on'}">${q}</span>`).join('')}</div><input class="inp" id="an2" placeholder="Rue, repère (facultatif)" style="margin:12px 0 14px"><button class="cp" id="ak">Enregistrer l’adresse</button>`;
 $('aq').querySelectorAll('span').forEach((e,i)=>e.onclick=()=>{k=i;$('aq').querySelectorAll('span').forEach(x=>x.classList.toggle('on',x===e))});
 $('ak').onclick=()=>{const n=$('an1').value.trim();if(!n)return toast('Donne un nom à l’adresse');const d=$('an2').value.trim();ADDR.push({n,a:Q[k]+', Niamey'+(d?' · '+d:''),k:Q[k]});ASEL=ADDR.length-1;$('cf').classList.remove('show');$('scrim').classList.remove('show');cb&&cb();toast('Adresse enregistrée')}}
const rpos=(a,b,t0,dur)=>{const dx=b[0]-a[0],dy=b[1]-a[1],tot=Math.abs(dx)+Math.abs(dy)||1,d=Math.min(1,(Date.now()-t0)/(dur*1000))*tot;return d<=Math.abs(dx)?[a[0]+Math.sign(dx)*d,a[1]]:[b[0],a[1]+Math.sign(dy)*(d-Math.abs(dx))]};
function baseMap(v,u){const ma=[],mi=[];for(let i=0;i<=800;i+=100)ma.push(`M${i} 0V600`);for(let j=0;j<=600;j+=100)ma.push(`M0 ${j}H800`);if(v.w<460){for(let i=50;i<800;i+=100)mi.push(`M${i} 0V600`);for(let j=50;j<600;j+=100)mi.push(`M0 ${j}H800`)}
 return `<rect x="-300" y="-300" width="1400" height="1200" style="fill:var(--bg);stroke:none"/><rect width="800" height="600" rx="10" style="fill:var(--surface);stroke:none"/><path d="M0 390C140 330 260 410 390 355S640 300 800 365" style="fill:none;stroke:var(--tc);stroke-width:34;opacity:.7;stroke-linecap:round"/><rect x="300" y="60" width="90" height="70" rx="14" style="fill:var(--tc);opacity:.35;stroke:none"/><rect x="640" y="440" width="110" height="90" rx="14" style="fill:var(--tc);opacity:.35;stroke:none"/><path d="${mi.join('')}" style="fill:none;stroke:var(--outline);stroke-width:3;opacity:.7"/><path d="${ma.join('')}" style="fill:none;stroke:var(--outline);stroke-width:9;stroke-linecap:round"/>${['Plateau','Yantala','Lazaret','Terminus','Koira Kano'].map(k=>`<text x="${GEO[k][0]}" y="${GEO[k][1]+16*u}" text-anchor="middle" style="font:600 ${10*u}px Inter,sans-serif;fill:var(--muted);stroke:none;opacity:.8">${k}</text>`).join('')}`}
const gpin=(p,c,sq,l,u)=>`<g transform="translate(${p[0]} ${p[1]}) scale(${u*.9})"><path d="M0 0C-7 -10 -13 -15 -13 -23A13 13 0 1 1 13 -23C13 -15 7 -10 0 0Z" style="fill:${c};stroke:var(--surface);stroke-width:2.5"/>${sq?'<rect x="-5" y="-28" width="10" height="10" rx="2" style="fill:#fff;stroke:none"/>':'<circle cx="0" cy="-23" r="5" style="fill:#fff;stroke:none"/>'}</g>${l?`<text x="${p[0]}" y="${p[1]+15*u}" text-anchor="middle" style="font:700 ${10*u}px Inter,sans-serif;fill:var(--on);stroke:var(--surface);stroke-width:${3*u}px;paint-order:stroke">${l}</text>`:''}`,
groute=(a,b,c,u)=>`<path d="M${a[0]} ${a[1]}L${b[0]} ${a[1]}L${b[0]} ${b[1]}" style="fill:none;stroke:${c};stroke-width:${3.5*u};stroke-dasharray:${u} ${8*u};stroke-linecap:round"/>`,
grider=(p,u,on=1)=>`<circle id="rdc" cx="${p[0]}" cy="${p[1]}" r="${8*u}" style="fill:${on?'var(--t)':'var(--muted)'};stroke:var(--surface);stroke-width:${3*u}"/>`;
function mloop(){Object.values(MAPS).forEach(M=>{if(!M.svg||!M.svg.isConnected||!M.rider)return;const e=M.svg.querySelector('#rdc'),p=M.rider();if(e&&p){e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])}});requestAnimationFrame(mloop)}
function GM(key,host,cfg){const M=MAPS[key]=Object.assign({},cfg,{key,host});
 host.innerHTML=`<svg class="gm"></svg><div class="mlg"><div><i style="background:var(--p)"></i>Vendeur</div><div><i style="background:#3b5bdb"></i>Acheteur</div><div><i style="background:var(--t)"></i>Coursier</div></div><div class="mc"><button data-z="in" aria-label="Zoom avant">+</button><button data-z="out" aria-label="Zoom arrière">−</button><button data-z="fit" aria-label="Recentrer">${S('target')}</button>${cfg.zone?`<button data-z="zone" aria-label="Zone de réception">${S('zone')}</button>`:''}</div>`;
 const svg=M.svg=host.querySelector('svg.gm'),rt=()=>{const r=host.getBoundingClientRect();return r.width?r.height/r.width:1.2};M.v={x:0,y:0,w:800,h:600};
 M.draw=()=>{const v=M.v,u=v.w/360;VIEWS[key]={...v};svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);svg.innerHTML=baseMap(v,u)+M.layers(u)};
 M.fit=()=>{const P=M.pts().filter(Boolean),r=rt(),x0=Math.min(...P.map(p=>p[0])),x1=Math.max(...P.map(p=>p[0])),y0=Math.min(...P.map(p=>p[1])),y1=Math.max(...P.map(p=>p[1])),w=Math.min(1000,Math.max(x1-x0+180,(y1-y0+180)/r,180));M.v={x:(x0+x1)/2-w/2,y:(y0+y1)/2-w*r/2,w,h:w*r};M.draw()};
 const zoomAt=(cx,cy,nw)=>{const r=svg.getBoundingClientRect(),v=M.v,fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height;nw=Math.max(90,Math.min(1000,nw));const nh=nw*rt();v.x+=(v.w-nw)*fx;v.y+=(v.h-nh)*fy;v.w=nw;v.h=nh;M.draw()};
 const ps=new Map();let pd=0,pw=0;
 svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);if(ps.size===2){const[a,b]=[...ps.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pw=M.v.w}});
 svg.addEventListener('pointermove',e=>{if(!ps.has(e.pointerId))return;const o=ps.get(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect();
  if(ps.size===1){const k=M.v.w/r.width;M.v.x-=(e.clientX-o[0])*k;M.v.y-=(e.clientY-o[1])*k;M.draw()}else if(ps.size===2&&pd>0){const[a,b]=[...ps.values()];zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pw*pd/Math.max(10,Math.hypot(a[0]-b[0],a[1]-b[1])))}});
 const up=e=>{ps.delete(e.pointerId);pd=0};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
 svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,M.v.w*(e.deltaY>0?1.15:.87))},{passive:false});
 host.querySelectorAll('[data-z]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const z=b.dataset.z;if(z==='fit')M.fit();else if(z==='zone')cfg.zone();else{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,M.v.w*(z==='in'?.7:1.43))}});
 if(cfg.keep&&VIEWS[key]){M.v={...VIEWS[key]};M.draw()}else M.fit();
 if(!mapLoop){mapLoop=1;requestAnimationFrame(mloop)}return M}
function fixR(r){r.ps=r.ps||geo(r.sa);r.pb=r.pb||geo(r.ca);r.kmS=Math.round(dist(CR.pos,r.ps)*10)/10;r.kmC=Math.round(dist(r.ps,r.pb)*10)/10;return r}
function cmapGM(){const j=CR.job,r=CR.req||(j&&j.r),R=CRad*80,
 rider=()=>{if(!j)return CR.pos;const s=j.step,q=j.r;return s===0?rpos(CR.pos,q.ps,j.t0,Math.max(8,q.kmS*5)):s===1?q.ps:s===2?rpos(q.ps,q.pb,j.t0,Math.max(12,q.kmC*6)):q.pb};
 GM('c',$('cmapv'),{zone:zoneSheet,rider,
 pts:()=>r?[CR.pos,r.ps,r.pb]:(CR.on||CR.zone)?[[CR.pos[0]-R,CR.pos[1]-R],[CR.pos[0]+R,CR.pos[1]+R]]:[CR.pos],
 layers:u=>{let s='';const idle=!j&&!r;
  if(idle&&(CR.on||CR.zone))s+=`<circle cx="${CR.pos[0]}" cy="${CR.pos[1]}" r="${R}" style="fill:var(--t);opacity:.08;stroke:none"/><circle cx="${CR.pos[0]}" cy="${CR.pos[1]}" r="${R}" style="fill:none;stroke:var(--t);stroke-width:${2*u};stroke-dasharray:${6*u} ${5*u}"/>`;
  if(idle&&CR.on)s+=[[470,210,40],[200,260,34]].map(h=>`<circle cx="${h[0]}" cy="${h[1]}" r="${h[2]}" style="fill:var(--p);opacity:.2;stroke:none"><animate attributeName="r" values="${h[2]*.7};${h[2]*1.2};${h[2]*.7}" dur="3s" repeatCount="indefinite"/></circle><text x="${h[0]}" y="${h[1]+4*u}" text-anchor="middle" style="font:700 ${10*u}px Inter,sans-serif;fill:var(--p);stroke:none">+500 F</text>`).join('');
  if(r){if(!j||j.step===0)s+=groute(CR.pos,r.ps,'var(--t)',u);if(!j||j.step===2)s+=groute(r.ps,r.pb,'var(--p)',u);s+=gpin(r.ps,'var(--p)',1,r.st,u)+gpin(r.pb,'#3b5bdb',0,mk(r.cl),u)}
  return s+grider(rider(),u,CR.on)}})}
function trkMap(o,L){const vi=V.findIndex(v=>v[4]===o[1]),sP=L.s||geo(SA[vi<0?0:vi]),bP=L.b||geo('Plateau'),ph=L.ph,c0=L.c0||CR.pos,t0=L.pt||Date.now(),
 rider=()=>ph===0?null:ph===1?rpos(c0,sP,t0,L.d1||Math.max(8,dist(c0,sP)*5)):ph===2?sP:ph===3?rpos(sP,bP,t0,L.d3||Math.max(12,dist(sP,bP)*6)):bP;
 GM('t'+o[0],$('tmap'),{keep:1,rider,pts:()=>[sP,bP,rider()],layers:u=>{let s='';if(ph===1)s+=groute(c0,sP,'var(--t)',u);s+=groute(sP,bP,'var(--p)',u)+gpin(sP,'var(--p)',1,o[1],u)+gpin(bP,'#3b5bdb',0,'Toi',u);const p=rider();return s+(p?grider(p,u):'')}})}
function zoneSheet(){CR.zone=1;cmv();csheet(`<h3>Zone de réception</h3><p class="cmt" style="text-align:center">Tu reçois les demandes dont le vendeur se trouve dans ce rayon autour de ta position.</p><div style="text-align:center;font-size:28px;font-weight:800;color:var(--t)" id="zv">${CRad} km</div><input type="range" id="zr" min="1" max="10" step="1" value="${CRad}" style="width:100%;margin:10px 0;accent-color:var(--t)"><button class="cp" id="zk">Enregistrer</button>`);
 $('zr').oninput=e=>{CRad=+e.target.value;$('zv').textContent=CRad+' km';MAPS.c&&MAPS.c.draw()};
 $('zk').onclick=()=>{CR.zone=0;coff();cmv();pfR();toast('Zone de réception : '+CRad+' km');if(CR.on&&!CR.job&&!CR.req)nextReq(1500)}}
cmv();cpR();
$('xp').innerHTML=S('search');$('xp').onclick=()=>$('disc').classList.add('show');$('ex').onclick=()=>$('disc').classList.remove('show');
$('theme').onclick=()=>{
  const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=r.dataset.theme||(d?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
};
